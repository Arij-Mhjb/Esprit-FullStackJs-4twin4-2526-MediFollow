sonar.projectKey=Arijmhjb_Esprit-FullStackJs-4twin4-2526-MediFollow
sonar.organization=arijmhjb
sonar.projectName=MediFollow

# Source code — scan all folders but exclude UI-only files from coverage
sonar.sources=app,components,lib,hooks,contexts,types
sonar.exclusions=**/__tests__/**,**/*.test.ts,**/node_modules/**,**/.next/**

# Test configuration
sonar.tests=__tests__
sonar.test.inclusions=**/__tests__/**/*.test.ts,**/__tests__/**/*.test.tsx

# TypeScript / JavaScript coverage
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclude UI pages/components and pure config files from coverage measurement
# Only lib (business logic, actions, services) is measured for coverage
sonar.coverage.exclusions=\
  app/**/*.tsx,\
  app/**/*.ts,\
  components/**/*.tsx,\
  hooks/**/*.ts,\
  contexts/**/*.tsx,\
  types/**/*.ts,\
  **/*.js,\
  **/prisma/**,\
  instrumentation.ts

# Language
sonar.language=ts
sonar.sourceEncoding=UTF-8

# Links
sonar.links.homepage=https://github.com/Arijmhjb/Esprit-FullStackJs-4twin4-2526-MediFollow
sonar.links.ci=https://github.com/Arijmhjb/Esprit-FullStackJs-4twin4-2526-MediFollow/actions
