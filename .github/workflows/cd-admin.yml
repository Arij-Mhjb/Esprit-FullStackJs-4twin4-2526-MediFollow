name: CD — Admin Module

on:
  workflow_run:
    workflows: ["CI — Admin Module"]
    types:
      - completed
    branches: [main, develop]

jobs:
  docker-push:
    name: Build & Push Admin Module Image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/medifollow-admin
          tags: |
            type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == 'main' }}
            type=raw,value=${{ github.event.workflow_run.head_sha }}
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./espace-admin
          file: ./espace-admin/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-push
    if: ${{ github.event.workflow_run.head_branch == 'develop' }}
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/medifollow-admin medifollow-admin=ghcr.io/${{ github.repository_owner }}/medifollow-admin:${{ github.event.workflow_run.head_sha }} -n medifollow-staging
          kubectl rollout status deployment/medifollow-admin -n medifollow-staging --timeout=300s

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-push
    if: ${{ github.event.workflow_run.head_branch == 'main' }}
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/medifollow-admin medifollow-admin=ghcr.io/${{ github.repository_owner }}/medifollow-admin:${{ github.event.workflow_run.head_sha }} -n medifollow-production
          kubectl rollout status deployment/medifollow-admin -n medifollow-production --timeout=300s

      - name: Run database migrations
        run: |
          kubectl exec -n medifollow-production deployment/medifollow-admin -- npm run prisma:migrate

      - name: Health check
        run: |
          kubectl run health-check --image=curlimages/curl --rm -i --restart=Never -- curl -f http://medifollow-admin.medifollow-production.svc.cluster.local/health